<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food, LLC</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-default">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="#">Food, LLC</a>
        <button type="button" class="navbar-toggle collapsed visible-xs"
                data-toggle="collapse" data-target="#mobile-nav"
                aria-expanded="false" aria-controls="mobile-nav">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
      </div>
      <div id="mobile-nav" class="navbar-collapse collapse visible-xs">
        <ul class="nav navbar-nav navbar-mobile">
          <li><a href="#chicken">Chicken</a></li>
          <li><a href="#beef">Beef</a></li>
          <li><a href="#sushi">Sushi</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <h1 id="top" class="text-center">Our Menu</h1>
  </div>

  <div class="container-fluid">
    <div class="row">
      <section class="col-xs-12 tall-section">
        <p class="lead">
          This is the tall section required by the assignment.
        </p>
        <article id="chicken" class="menu-block">
          <h3 class="text-center">Chicken</h3>
          <p>Lorem ipsum dolor sit amet...</p>
          <p class="back-top"><a href="#top">Back To Top</a></p>
        </article>
        <article id="beef" class="menu-block">
          <h3 class="text-center">Beef</h3>
          <p>Duis aute irure dolor in reprehenderit...</p>
          <p class="back-top"><a href="#top">Back To Top</a></p>
        </article>
        <article id="sushi" class="menu-block">
          <h3 class="text-center">Sushi</h3>
          <p>Nemo enim ipsam voluptatem quia voluptas...</p>
          <p class="back-top"><a href="#top">Back To Top</a></p>
        </article>
      </section>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
  <script>
    $(function () {
      $('#mobile-nav a').on('click', function () {
        $('#mobile-nav').collapse('hide');
      });
    });
  </script>
</body>
</html>
